name: gym_app
description: "La mejor app de gimnasio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  flutter_bloc: ^9.1.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1
  google_fonts: ^8.2.0
  dio: ^5.10.0
  go_router: ^17.3.0
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  awesome_snackbar_content: ^0.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - lib/assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/gymfit_logo.png"